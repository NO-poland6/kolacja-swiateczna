<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Zaproszenie prywatne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style id="lock-css">
  :root{ --choco:#331816; --wine:#562320; --brick:#7B2F2B; --sand:#DFCDB7; --cream:#F7F3ED; --line:#ECE3D8; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body.locked{ font-family:'Poppins',system-ui,sans-serif; color:var(--choco); background:#fff; min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center; padding:24px; font-weight:300; -webkit-font-smoothing:antialiased; }
  .lock{ width:100%; max-width:420px; background:#fff; border:1px solid var(--line); border-radius:24px; padding:40px 36px 36px; text-align:center;
    box-shadow:0 10px 40px rgba(51,24,22,.06); }
  .lock .ic{ width:64px; height:64px; border-radius:50%; background:var(--cream); display:grid; place-items:center; margin:0 auto 18px; }
  .lock h1{ font-weight:600; font-size:24px; line-height:1.25; color:var(--wine); letter-spacing:-0.005em; }
  .lock p{ font-size:15px; margin-top:8px; }
  .lock form{ margin-top:24px; display:grid; gap:12px; text-align:left; }
  .lock label{ font-size:14px; font-weight:400; color:var(--wine); }
  .lock input{ font-family:inherit; font-size:16px; font-weight:300; color:var(--choco); border:1px solid var(--sand); border-radius:12px; padding:13px 14px; width:100%; outline:none; }
  .lock input:focus{ border-color:var(--brick); box-shadow:0 0 0 3px rgba(123,47,43,.12); }
  .lock input.bad{ border-color:#b3261e; }
  .lock button{ font-family:inherit; font-weight:500; font-size:16px; background:var(--brick); color:var(--cream); border:0; border-radius:12px; padding:14px; cursor:pointer; }
  .lock button:hover{ background:var(--wine); }
  .lock button[disabled]{ opacity:.7; cursor:progress; }
  .lock{ transition:opacity .45s ease, transform .45s cubic-bezier(.4,0,.2,1); }
  .lock.out{ opacity:0; transform:scale(.94) translateY(-8px); }
  .lock .err{ display:none; color:#b3261e; font-size:14px; font-weight:400; }
  .lock .err.show{ display:block; }
  .lock .stars{ margin-top:22px; color:var(--brick); font-size:13px; font-weight:500; letter-spacing:.02em; }
  noscript{ display:block; margin-top:16px; font-size:14px; }
</style>
</head>
<body class="locked">
<main class="lock" id="lock">
  <div class="ic" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7B2F2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></div>
  <h1>Zaproszenie prywatne</h1>
  <p>Wpisz hasło, aby zobaczyć zaproszenie.</p>
  <form id="lockForm" autocomplete="off">
    <label for="pw">Hasło</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <div class="err" id="lockErr" role="alert">Nieprawidłowe hasło</div>
    <button type="submit" id="lockBtn">Wejdź</button>
  </form>
  <noscript>Do otwarcia zaproszenia potrzebna jest włączona obsługa JavaScript.</noscript>
  <div class="stars">✦ Wesołych Świąt ✦</div>
</main>

<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var SKEY = 'zaproszenie-k1';
  function b64d(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return u; }
  function b64e(buf){ var u=new Uint8Array(buf), s=''; for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]); return btoa(s); }
  function derive(pw){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(P.salt), iterations:P.iter, hash:'SHA-256'}, base,
        {name:'AES-GCM', length:256}, true, ['decrypt']);
    });
  }
  function decrypt(key){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(P.iv)}, key, b64d(P.ct)).then(function(pt){
      return { key:key, data:JSON.parse(new TextDecoder().decode(pt)) };
    });
  }
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function reveal(d){
    var lock = document.getElementById('lock');
    if(reduce || !lock){ inject(d); return; }
    lock.classList.add('out');
    setTimeout(function(){ inject(d); }, 480);
  }
  function inject(d){
    document.title = d.title;
    var st = document.createElement('style'); st.textContent = d.css; document.head.appendChild(st);
    document.getElementById('lock-css').remove();
    document.body.className = '';
    document.body.innerHTML = d.html;
    window.scrollTo(0,0);
    var sc = document.createElement('script'); sc.textContent = d.js; document.body.appendChild(sc);
    if(location.hash){ var t=document.getElementById(location.hash.slice(1)); if(t) t.scrollIntoView(); }
  }
  function remember(key){
    try{ crypto.subtle.exportKey('raw', key).then(function(r){ sessionStorage.setItem(SKEY, b64e(r)); }); }catch(e){}
  }
  // session convenience: reuse the derived key (never the password) for this tab only
  try{
    var saved = sessionStorage.getItem(SKEY);
    if(saved){
      crypto.subtle.importKey('raw', b64d(saved), {name:'AES-GCM'}, false, ['decrypt'])
        .then(decrypt).then(function(r){ reveal(r.data); })
        .catch(function(){ sessionStorage.removeItem(SKEY); });
    }
  }catch(e){}

  var form = document.getElementById('lockForm'), input = document.getElementById('pw'),
      err = document.getElementById('lockErr'), btn = document.getElementById('lockBtn');
  input.addEventListener('input', function(){ err.classList.remove('show'); input.classList.remove('bad'); });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(!window.crypto || !crypto.subtle){ err.textContent='Ta przeglądarka nie obsługuje odszyfrowania (wymagane HTTPS).'; err.classList.add('show'); return; }
    btn.disabled = true; btn.textContent = 'Otwieram…';
    derive(input.value).then(decrypt).then(function(r){
      remember(r.key); reveal(r.data);
    }).catch(function(){
      err.textContent = 'Nieprawidłowe hasło'; err.classList.add('show'); input.classList.add('bad');
      input.select(); btn.disabled = false; btn.textContent = 'Wejdź';
    });
  });
})();
</script>
